<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>online game</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game">
        <div class="chat">
            <div id="messages"></div>
            <div class="chat-form">
                <input type="text" id="messageInput" placeholder="メッセージを入力" maxlength="100">
                <button id="sendButton" type="button">送信</button>
            </div>
        </div>
        <canvas id="gamecanvas"></canvas>
        <canvas id="touchcanvas"></canvas>
    </div>
    <script src="script.js"></script>
</body>

</html>
